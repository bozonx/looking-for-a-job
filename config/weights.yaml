# Машиночитаемые веса скоринга (см. config/preferences.md).
# overall = Σ(w·score) / Σ(w) по всем ненулевым весам, округление до целого.
# Для "inverse" используется (100 - score): чем выше оценка, тем хуже.
# fit — берётся максимум по трекам из fit_tracks (вес трека 0 — трек игнорируется).
version: 3
# Уровень (senior+) и язык в заголовке отсекает предфильтр (prefilter.yaml); форма занятости на оценку не влияет — весов для них нет.
positive:
  remote: 3
  legitimacy: 2
  fit: 8                        # главный фактор: нерелевантная роль не должна вытягиваться удалёнкой/легитимностью
  region: 1
  language: 2
  startup: 1.5
inverse:
  corporate: 2
  outsource: 0                  # аутсорс/аутстаф — норм; оценку агент всё равно ставит
fit_tracks:
  vue: 1                        # 1-й приоритет
  react: 0.9                    # 2-й приоритет
  angular: 0.8                  # 3-й приоритет
  fullstack: 0.9                # 2-й приоритет
  ai_engineer: 1                # 1-й приоритет; ролевые AI-native вакансии; бэкенд-язык без опыта (Python/Go/Rust/C#/Java/PHP/Ruby) в заголовке → низкий fit (playbooks/scoring.md)
  automation: 0.8               # 3-й приоритет; n8n / Make / Zapier, ИИ-агенты, бизнес-автоматизация, VPS (playbooks/scoring.md)
# Нерелевантная роль: если лучший fit по треку (без веса трека) < below — overall не выше cap.
# Сырой, а не взвешенный: иначе angular/automation (вес 0.8) с fit 45 попадали бы под cap наравне с нерелевантными.
fit_cap:
  below: 40
  cap: 35
# Стоп-флаги (любой → overall = 0) — список STOP_FLAGS в scripts/lib/schema.ts.
scam_legitimacy_below: 30                                        # автоматически ставит флаг scam

# Уровень оценивается отдельно от совпадения стека.
seniority_cap:
  levels: [junior]
  cap: 35
