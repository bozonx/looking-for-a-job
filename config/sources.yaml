# Настройки провайдеров сбора (описание источников — config/sources.md).

# Стандартные ленты: RSS 2.0, Atom 1.0, JSON Feed. Каждая лента — отдельный источник с этим id.
# id — латиница в нижнем регистре, цифры, дефис. Новый id добавь также в config/apply-priority.yaml,
# BOARDS (scripts/lib/target.ts), freshness_days ниже и таблицу config/sources.md — `npm test` проверит.
# title_format: как разбирать заголовок элемента —
#   "company: title" (We Work Remotely), "title at company", "title" (компания из author/поля company_field).
# location_field / company_field / tags_field / employment_field — имя дополнительного XML-поля элемента (если есть).
# title_regex — регулярка по заголовку с именованными группами title / company / location / salary
#   (salary — «от N до M ₽», месячная вилка; валюты ₽ $ € ₸ ₴ £ или код ISO);
# description_regex — по тексту описания (без HTML, абзацы — отдельные строки), группы company / location.
# full_page: true — описание в ленте обрезано: для прошедших предфильтр полный текст берётся со страницы
#   вакансии (schema.org JobPosting в ld+json).
feeds:
  - id: weworkremotely
    name: We Work Remotely
    title_format: "company: title"
    location_field: region
    tags_field: skills
    employment_field: type
    urls:
      - https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss
      - https://weworkremotely.com/categories/remote-back-end-programming-jobs.rss

  # Хабр Карьера: RSS поиска, только «можно удалённо».
  # Заголовок: «Требуется «Роль» (Город, зарплата)» — любая часть скобок может отсутствовать; компания — в <author>.
  - id: habr
    name: Хабр Карьера
    full_page: true    # в ленте 1–2 строки; полный текст — из JobPosting на странице
    title_regex: "^Требуется «(?<title>.+)»(?:\\s*\\((?:(?<location>(?!от\\s|до\\s)[^()]*?)(?:,\\s*)?)?(?<salary>(?:от|до)\\s[^()]*)?\\))?$"
    urls:
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=vue
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=nuxt
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=react
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=typescript
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=fullstack
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=frontend
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=n8n
      - https://career.habr.com/vacancies/rss?type=all&remote=true&q=%D0%B0%D0%B2%D1%82%D0%BE%D0%BC%D0%B0%D1%82%D0%B8%D0%B7%D0%B0%D1%86%D0%B8%D1%8F

  # VueJobs: все активные вакансии одной лентой (~900, свежие сверху). Компания и локация — в начале описания.
  - id: vuejobs
    name: VueJobs
    full_page: true    # в ленте описание обрезано
    description_regex: "Employer:\\s*(?<company>[^\\n]+)\\nLocation:\\s*(?<location>[^\\n]+)"
    urls:
      - https://vuejobs.com/feed/posts

  # NoDesk: только последние ~10 вакансий удалёнки, «Title at Company». Собирать не реже раза в 1–2 дня,
  # иначе пропущенное между сборами теряется.
  - id: nodesk
    name: NoDesk
    title_format: "title at company"
    urls:
      - https://nodesk.co/remote-jobs/index.xml

  # Djinni (Украина, много удалёнки от западных компаний): RSS поиска, по 100 последних на категорию.
  # primary_keyword — категория сайта (JavaScript, Fullstack, React.js, Vue.js, Node.js, Angular…);
  # неизвестное значение молча отдаёт всю ленту. Компании в ленте нет — берётся из JobPosting страницы.
  - id: djinni
    name: Djinni
    title_format: "title"
    full_page: true
    urls:
      - https://djinni.co/jobs/rss/?primary_keyword=JavaScript&employment=remote
      - https://djinni.co/jobs/rss/?primary_keyword=Fullstack&employment=remote
      - https://djinni.co/jobs/rss/?primary_keyword=React.js&employment=remote
      - https://djinni.co/jobs/rss/?primary_keyword=Vue.js&employment=remote
      - https://djinni.co/jobs/rss/?primary_keyword=Node.js&employment=remote
      - https://djinni.co/jobs/rss/?primary_keyword=Angular&employment=remote

# Публичные API систем найма: полный список открытых вакансий компании.
# Список слагов или словарь «слаг: название» (Lever и Ashby название компании не отдают).
# Вакансия пропала из списка → possibly_closed: true. Слаг — из адреса страницы вакансий:
#   greenhouse: boards.greenhouse.io/<slug> · lever: jobs.lever.co/<slug> · ashby: jobs.ashbyhq.com/<slug>
# Подбор: удалёнка, продуктовые стартапы, стек JS/TS/AI. Крупные корпорации — сознательно не включены.
ats:
  greenhouse: [vercel, gitlab, grafanalabs, contentful, storyblok, netlify, airtable, wikimedia]
  ashby:
    linear: Linear
    supabase: Supabase
    posthog: PostHog
    zapier: Zapier
    n8n: n8n
    clerk: Clerk
    neon: Neon
    railway: Railway
    mintlify: Mintlify
    resend: Resend
    replit: Replit
    vapi: Vapi
    elevenlabs: ElevenLabs
    cursor: Cursor
    langchain: LangChain
    lovable: Lovable
    pylon: Pylon
    sanity: Sanity
    zed: Zed Industries
    warp: Warp
  lever:
    toptal: Toptal

# Himalayas: поисковые запросы (по 20 вакансий на страницу, свежие первыми).
himalayas:
  queries: [vue, nuxt, react, typescript, full stack, ai engineer, n8n, ai automation]

# Get on Board: категории и какие форматы работы брать.
# remote_modality: fully_remote | remote_local | hybrid | no_remote; не-удалённые берутся только в этих странах.
getonbrd:
  categories: [programming]
  remote: [fully_remote, remote_local]
  office_countries: [Argentina]

# Remotive: категория API (данные с задержкой ~24 ч; по правилам — не чаще 4 запросов в день).
# Ровно одна: каждая категория — отдельный запрос, а интервал 6 ч считается на источник (больше одной — ошибка).
remotive:
  categories: [software-dev]

# Jobicy: параметр industry API.
jobicy:
  industries: [dev]

# Working Nomads: какие категории брать (остальные отсеиваются до предфильтра). API отдаёт последние ~30–50 —
# при редком сборе часть теряется.
workingnomads:
  categories: [Development]

# Landing.jobs: все активные вакансии (snapshot). Удалённые — всегда; офисные — только в этих странах (ISO).
landingjobs:
  office_countries: []

# Bumeran / ZonaJobs (Аргентина, одна платформа): фильтры поиска как в URL сайта (/empleos-area-<value>.html).
bumeran:
  filters:
    - { id: area, value: tecnologia-sistemas-y-telecomunicaciones }
zonajobs:
  filters:
    - { id: area, value: tecnologia-sistemas-y-telecomunicaciones }

# Computrabajo (Аргентина): страницы списка ar.computrabajo.com (без домена), пагинация ?p=N.
computrabajo:
  pages:
    - /empleos-de-informatica-y-telecom

# Y Combinator: страницы списка ycombinator.com (без домена). Snapshot: пропала со страницы → possibly_closed.
yc:
  pages:
    - /jobs/role/software-engineer/remote

# HeadHunter СНГ (hh.kz / hh.uz / rabota.by / hh.kg / hh.az — одна база, разбор страницы поиска).
# areas — id регионов hh: 40 Казахстан, 97 Узбекистан, 16 Беларусь, 48 Кыргызстан, 9 Азербайджан, 28 Грузия,
# 1001 другие регионы (113 Россия не включена; пусто — все регионы). remote_only — только «удалённо».
hh:
  queries: [vue, nuxt, react, typescript, fullstack, frontend, n8n, автоматизация бизнес-процессов]
  areas: ["40", "97", "16", "48", "9", "28", "1001"]
  remote_only: true

# getmatch: API отдаёт все активные вакансии (поиска нет); remote_only — офис/гибрид отсеиваются до предфильтра.
getmatch:
  remote_only: true

# GeekJob: все активные вакансии (~200); remote_only — офисные отсеиваются до предфильтра.
geekjob:
  remote_only: true

# Свежесть, дней с публикации. Действует в двух местах:
# - сбор: окно сбора не глубже min(COLLECT_MAX_AGE_DAYS, freshness_days) — более старые вакансии не загружаются вовсе;
# - скоринг: собранные ранее, но уже постаревшие, в очередь (npm run pending) не попадают; файлы остаются,
#   взять их — `npm run pending -- --stale` (это только то, что было собрано, пока было свежим).
# null — без ограничения (окно — COLLECT_MAX_AGE_DAYS; snapshot-источники берут весь список без окна).
# Каждый источник — с явным значением (проверяет `npm test`); default — запасной.
freshness_days:
  default: 7
  # большие площадки, много откликов — важна скорость
  remoteok: 3
  himalayas: 3
  jobicy: 3
  remotive: 4        # данные с задержкой ~24 ч
  weworkremotely: 5
  workingnomads: 5
  vuejobs: 7
  nodesk: 7
  getonbrd: 7
  habr: 7
  bumeran: 7
  zonajobs: 7
  computrabajo: 7
  djinni: 7
  hh: 7
  getmatch: 7
  geekjob: 7
  # редкие публикации
  hn: 30             # тред раз в месяц, компании пишут в первые дни; окно сбора ещё ограничено COLLECT_MAX_AGE_DAYS
  ats: null
  yc: null
  landingjobs: null
