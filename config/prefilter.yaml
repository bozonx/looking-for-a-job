# Предфильтр по заголовку/тегам ДО скоринга (дёшево, без LLM).
# Правило: если заголовок содержит exclude_title → отсеять.
# Иначе оставить, если заголовок содержит include_title ИЛИ среди тегов есть include_tags.
# Сравнение регистронезависимое: «словные» ключи — с начала слова (node → nodejs), прочие — подстрокой.
# Суффикс `$` — ещё и по концу слова (intern$ не ловит Internal).
