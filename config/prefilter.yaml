# Предфильтр по заголовку/тегам ДО скоринга (дёшево, без LLM).
# Правило: если заголовок содержит exclude_title → отсеять.
# Иначе оставить, если заголовок содержит include_title ИЛИ среди тегов есть include_tags.
# Сравнение регистронезависимое: «словные» ключи — с начала слова (node → nodejs), прочие — подстрокой.
# Суффикс `$` — ещё и по концу слова (intern$ не ловит Internal).
# Порядок: exclude_title (абсолютно) → exclude_title_unless (отсеять, если нет ни одного «спасающего» ключа)
#   → exclude_title_soft (отсеять, если в заголовке нет strong_title) → include.
# Короткие ключи (qa, sap, vp…) — с `$`, иначе ловят начало чужих слов (Qatar, Sapient, VPN).
# Бэкенд без языка в заголовке («Backend Engineer») не отсеивается: в топе такие часто на TS/Node.
#   «Чистый» бэкенд на чужом стеке режет exclude_title_soft (java/python/go/.net/php…), остальное решает скоринг.
