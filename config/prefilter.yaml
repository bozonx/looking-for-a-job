# Отсеять, если в заголовке нет ни одного ключа из списка справа.
# junior — только чисто джунские; «Junior/Middle», «junior to mid» остаются.
# manager/director/head of — только чисто управленческие; «Head of Frontend», «Lead Engineer / Manager»,
#   «AI Product Engineer, AI Product Manager» остаются (в заголовке есть инженерная роль или целевой стек).
exclude_title_unless:
  junior: &mid [middle, mid, mid-level, midlevel, senior, мидл, миддл, сеньор, ssr, semi senior, semisenior]
  jr$: *mid
  jr.: *mid
  джуниор: *mid
  director: [frontend, front-end, fullstack, full-stack, full stack]
  head of: [frontend, front-end, fullstack, full-stack, full stack, engineering, development, web, ui$, разработк, vue, react, angular, javascript, typescript]
  руководитель: [разработк, фронтенд, frontend, группы разработ, тимлид, team lead]
# Исключения, которые уступают явному целевому стеку в заголовке: «Fullstack (.NET / React / Node.js)»,
# «Full Stack PHP/Vue.js», «Engineer, Marketing Platform (React)» проходят и попадают к скорингу (fit там решит).
# Язык в заголовке = нужен коммерческий опыт на нём (его нет) — но при целевом стеке рядом решает скоринг.
